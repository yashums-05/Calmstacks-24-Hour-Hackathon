<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Sign In — CalmStacks Hackathon</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #f8fafc;
    color: #1e293b;
    min-height: 100vh;
  }
  .inp {
    width: 100%;
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    font-size: 0.9rem;
    color: #0f172a;
    font-weight: 600;
    outline: none;
    transition: all 0.2s ease;
  }
  .inp::placeholder { color: #94a3b8; }
  .inp:focus {
    border-color: #0284c7;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
  }
  .btn-primary {
    background: #0f172a;
    color: #fff;
    transition: all 0.15s ease;
  }
  .btn-primary:hover {
    background: #1e293b;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.15);
  }
  .btn-primary:active {
    transform: scale(0.98);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-50">

<div class="w-full max-w-md">
  <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-xl">
    
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-slate-900 mx-auto flex items-center justify-center text-white font-black text-xl shadow-lg mb-4">
        CS
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Admin Portal</h1>
      <p class="text-slate-500 text-xs mt-1.5 font-medium">CalmStacks 24-Hour Hackathon</p>
      <p class="text-sky-700 font-bold text-[0.7rem] mt-1 font-mono">Organized by Dept. of CSE, MCE Hassan</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden mb-5 p-3.5 rounded-xl border text-xs font-bold transition-all"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 font-mono">User ID</label>
        <input id="userid" type="text" class="inp" placeholder="Enter admin user ID" autocomplete="username" required autofocus />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 font-mono">Password</label>
        <div class="relative">
          <input id="password" type="password" class="inp pr-10" placeholder="Enter password" autocomplete="current-password" required />
          <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm focus:outline-none">
            👁
          </button>
        </div>
      </div>

      <button id="submit-btn" type="submit" class="btn-primary w-full py-3.5 rounded-xl font-bold text-sm mt-2 flex items-center justify-center gap-2">
        <span>Sign In to Admin Panel</span>
      </button>
    </form>
    
    <div class="mt-6 pt-5 border-t border-slate-100 text-center">
      <a href="/" class="text-xs text-sky-600 hover:underline font-bold">← Back to Public Portal</a>
    </div>
  </div>
</div>

<script>
// If accidentally arrived with participant redirect, immediately bounce directly to participant page
(function() {
  const urlParams = new URLSearchParams(window.location.search);
  const redirect = urlParams.get('redirect');
  if (redirect && (redirect.startsWith('/m/') || redirect.startsWith('/p/') || redirect.startsWith('/participants/'))) {
    window.location.replace(redirect);
  }
})();

function togglePassword() {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
}

function showAlert(msg, isError = true) {
  const box = document.getElementById('alert-box');
  box.className = `mb-5 p-3.5 rounded-xl border text-xs font-bold transition-all ${
    isError 
      ? 'bg-rose-50 border-rose-200 text-rose-600' 
      : 'bg-emerald-50 border-emerald-200 text-emerald-600'
  }`;
  box.textContent = msg;
  box.classList.remove('hidden');
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const alertBox = document.getElementById('alert-box');
  alertBox.classList.add('hidden');
  
  const userid = document.getElementById('userid').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.innerHTML = `<span>Signing in...</span>`;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userid, password })
    });

    const data = await res.json();
    if (res.ok && data.success) {
      showAlert('Signed in successfully! Redirecting to Admin Panel...', false);
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || '/admin';
      setTimeout(() => {
        window.location.href = redirect;
      }, 400);
    } else {
      showAlert(data.error || 'Invalid user ID or password.');
      btn.disabled = false;
      btn.innerHTML = `<span>Sign In to Admin Panel</span>`;
    }
  } catch (err) {
    showAlert('Network error. Please try again.');
    btn.disabled = false;
    btn.innerHTML = `<span>Sign In to Admin Panel</span>`;
  }
}
</script>
</body>
</html>
